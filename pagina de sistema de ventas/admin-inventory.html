<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - TechNova ERP</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/admin-dashboard.css">
  <link rel="stylesheet" href="styles/admin-inventory.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h2>TechNova ERP</h2>
      </div>
      <nav class="sidebar__nav">
        <a href="admin-dashboard.html" class="sidebar__link">Dashboard</a>
        <a href="admin-inventory.html" class="sidebar__link sidebar__link--active">Inventario</a>
        <a href="admin-orders.html" class="sidebar__link">Órdenes</a>
        <a href="admin-reports.html" class="sidebar__link">Reportes</a>
        <a href="index.html" class="sidebar__link" style="margin-top: auto;">Volver a Tienda</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header u-flex-between">
        <h1>Gestión de Inventario</h1>
        <button id="btn-new-product" class="btn btn--primary">Nuevo Producto</button>
      </header>

      <div class="dashboard-content">
        <div class="card u-margin-bottom-4">
          <div class="card__body u-flex-between">
            <div class="form-group" style="margin: 0; width: 300px;">
              <input type="text" id="search-inventory" class="form-control" placeholder="Buscar por nombre o ID...">
            </div>
            <div class="form-group" style="margin: 0;">
              <select id="filter-stock" class="form-control">
                <option value="all">Todo el Inventario</option>
                <option value="low">Stock Bajo (< 15)</option>
                <option value="out">Agotados</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card__body">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Costo</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="inventory-table">
                  <!-- JS Injected -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="product-modal" class="modal u-hidden">
    <div class="modal-content card">
      <div class="card__header u-flex-between">
        <h3 id="modal-title">Nuevo Producto</h3>
        <button id="close-modal" class="btn btn--outline" style="padding: 4px 8px;">X</button>
      </div>
      <div class="card__body">
        <form id="product-form">
          <input type="hidden" id="prod-id">
          <div class="form-group">
            <label class="form-label">Nombre</label>
            <input type="text" id="prod-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea id="prod-desc" class="form-control" rows="3" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Precio ($)</label>
              <input type="number" id="prod-price" class="form-control" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label">Costo ($)</label>
              <input type="number" id="prod-cost" class="form-control" step="0.01" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Stock</label>
              <input type="number" id="prod-stock" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Categoría (ID)</label>
              <input type="text" id="prod-category" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Guardar Producto</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/admin-inventory.js"></script>
</body>
</html>
