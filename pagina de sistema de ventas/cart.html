<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - TechNova Store</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/cart.css">
</head>
<body>
  <header class="header">
    <div class="container u-flex-between">
      <a href="index.html" class="header__logo" ondblclick="event.preventDefault(); window.location.href='login.html';">TechNova</a>
      <nav class="header__nav">
        <a href="index.html" class="header__link">Inicio</a>
        <a href="catalog.html" class="header__link">Catálogo</a>
        <a href="cart.html" class="header__link header__link--active">Carrito <span id="cart-count" class="header__badge">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container u-margin-bottom-6">
    <h1 class="u-margin-bottom-4 u-text-center">Tu Carrito de Compras</h1>
    
    <div id="cart-empty" class="u-text-center u-hidden">
      <p class="u-text-muted u-margin-bottom-4">Tu carrito está vacío.</p>
      <a href="catalog.html" class="btn btn--primary">Volver al catálogo</a>
    </div>

    <div id="cart-content" class="cart-layout">
      <div class="cart-items" id="cart-items-container">
        <!-- Cart items injected via JS -->
      </div>
      <div class="cart-summary card">
        <div class="card__header">
          <h3>Resumen del Pedido</h3>
        </div>
        <div class="card__body">
          <div class="summary-line">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div class="summary-line">
            <span>Impuestos (21%)</span>
            <span id="summary-tax">$0.00</span>
          </div>
          <div class="summary-line summary-total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>
          <a href="checkout.html" class="btn btn--primary btn--block u-margin-bottom-3">Proceder al Pago</a>
          <button id="clear-cart" class="btn btn--outline btn--block">Vaciar Carrito</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container u-text-center">
      <p>&copy; 2026 TechNova Store.</p>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
