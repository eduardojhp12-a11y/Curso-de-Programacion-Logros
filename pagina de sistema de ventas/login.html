<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TechNova ERP</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-header u-text-center u-margin-bottom-4">
      <a href="index.html" class="login-logo">TechNova</a>
    </div>
    <div class="card login-card">
      <div class="card__body">
        <h2 class="u-margin-bottom-4">Iniciar Sesión</h2>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Usuario (admin)</label>
            <input type="text" id="username" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Contraseña (admin123)</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn--primary btn--block u-margin-top-3">Continuar</button>
        </form>
        <p class="u-text-sm u-text-muted u-margin-top-4">
          Al identificarte, aceptas nuestras Condiciones de uso y Aviso de privacidad.
        </p>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
