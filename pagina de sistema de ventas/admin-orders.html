<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes - TechNova ERP</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/admin-dashboard.css">
  <link rel="stylesheet" href="styles/admin-orders.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h2>TechNova ERP</h2>
      </div>
      <nav class="sidebar__nav">
        <a href="admin-dashboard.html" class="sidebar__link">Dashboard</a>
        <a href="admin-inventory.html" class="sidebar__link">Inventario</a>
        <a href="admin-orders.html" class="sidebar__link sidebar__link--active">Órdenes</a>
        <a href="admin-reports.html" class="sidebar__link">Reportes</a>
        <a href="index.html" class="sidebar__link" style="margin-top: auto;">Volver a Tienda</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header u-flex-between">
        <h1>Gestión de Órdenes</h1>
      </header>

      <div class="dashboard-content">
        <div class="card u-margin-bottom-4">
          <div class="card__body u-flex-between">
            <div class="form-group" style="margin: 0; width: 300px;">
              <input type="text" id="search-order" class="form-control" placeholder="Buscar por ID...">
            </div>
            <div class="form-group" style="margin: 0;">
              <select id="filter-status" class="form-control">
                <option value="all">Todos los estados</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En Proceso">En Proceso</option>
                <option value="Enviado">Enviado</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card__body">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="orders-table">
                  <!-- JS Injected -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Detalle -->
  <div id="order-modal" class="modal u-hidden">
    <div class="modal-content card" style="max-width: 800px;">
      <div class="card__header u-flex-between">
        <h3 id="modal-title">Detalle de Orden</h3>
        <button id="close-modal" class="btn btn--outline" style="padding: 4px 8px;">X</button>
      </div>
      <div class="card__body" id="order-details-content">
        <!-- Injected via JS -->
      </div>
      <div class="card__footer u-flex-between" id="order-actions">
        <!-- Buttons injected -->
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/admin-orders.js"></script>
</body>
</html>
