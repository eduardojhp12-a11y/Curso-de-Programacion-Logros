<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech & Web Dev News</title>
    <meta name="description" content="El mejor blog de noticias sobre tecnología, desarrollo web, inteligencia artificial y ciberseguridad.">

    <meta property="og:description" content="Mantente actualizado con las últimas noticias del mundo del desarrollo de software y tecnología.">

    <footer class="footer">

            <ul class="footer__links">
