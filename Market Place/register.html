<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="l-container">
            <div class="header__top" style="justify-content: center;">
                <a href="index.html" class="header__logo">
                    Market<span>Place</span>
                </a>
            </div>
        </div>
    </header>

    <main class="l-main l-container l-auth">
        <div class="c-auth-card">
            <h1 class="c-auth-card__title">Crear Cuenta</h1>
            
            <form id="register-form" novalidate>
                <div class="c-form__group">
                    <label for="name" class="c-form__label">Tu nombre</label>
                    <input type="text" id="name" name="name" class="c-form__input" required>
                    <span class="c-form__error" id="error-name">El nombre es obligatorio.</span>
                </div>

                <div class="c-form__group">
                    <label for="email" class="c-form__label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="c-form__input" required>
                    <span class="c-form__error" id="error-email">Introduce un correo electrónico válido.</span>
                </div>
                
                <div class="c-form__group">
                    <label for="password" class="c-form__label">Contraseña</label>
                    <input type="password" id="password" name="password" class="c-form__input" required placeholder="Al menos 6 caracteres">
                    <span class="c-form__error" id="error-password">La contraseña debe tener al menos 6 caracteres (mínimo 1 mayúscula y 1 número).</span>
                </div>

                <div class="c-form__group">
                    <label for="password-confirm" class="c-form__label">Vuelve a escribir la contraseña</label>
                    <input type="password" id="password-confirm" name="password-confirm" class="c-form__input" required>
                    <span class="c-form__error" id="error-password-confirm">Las contraseñas no coinciden.</span>
                </div>
                
                <button type="submit" class="c-button c-button--primary c-button--large" style="width: 100%;">
                    Crear tu cuenta
                </button>
            </form>
            
            <div class="c-auth-card__footer">
                <p>¿Ya tienes una cuenta? <a href="login.html" class="c-auth-card__link">Iniciar sesión</a></p>
            </div>
        </div>
    </main>

    <script src="global.js"></script>
    <script src="auth.js"></script>
</body>
</html>
