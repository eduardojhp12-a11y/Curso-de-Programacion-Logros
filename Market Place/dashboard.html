<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="l-container">
            <div class="header__top">
                <a href="index.html" class="header__logo">
                    Market<span>Place</span>
                </a>
                <form class="header__search" action="catalog.html" method="GET">
                    <label for="search" class="u-visually-hidden">Buscar productos</label>
                    <input type="text" id="search" name="q" class="header__search-input" placeholder="Buscar tecnología, ropa y más...">
                    <button type="submit" class="header__search-btn" aria-label="Buscar">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </form>
                <div class="header__actions">
                    <a href="dashboard.html" class="header__action-link js-auth-link">
                        <span class="header__action-text--small">Hola, Identifícate</span>
                        <span class="header__action-text--bold">Cuentas y Pedidos</span>
                    </a>
                    <a href="cart.html" class="header__action-link header__cart">
                        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span class="header__cart-count js-cart-count" style="display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="l-container">
        <div class="l-dashboard">
            <aside class="dashboard-sidebar">
                <div class="dashboard-sidebar__user">
                    <div class="dashboard-sidebar__avatar js-user-initial">U</div>
                    <h2 style="font-size: 1.125rem;" class="js-user-name">Usuario</h2>
                    <p style="color: var(--color-text-secondary); font-size: 0.875rem;" class="js-user-email">user@market.com</p>
                </div>
                <nav class="dashboard-nav">
                    <button class="dashboard-nav__link dashboard-nav__link--active" id="btn-orders">Mis Pedidos</button>
                    <button class="dashboard-nav__link" id="btn-addresses">Direcciones</button>
                    <button class="dashboard-nav__link" id="btn-admin" style="display: none;">Panel de Control</button>
                    <button class="dashboard-nav__link" id="btn-logout" style="color: var(--color-alert); margin-top: var(--space-4);">Cerrar Sesión</button>
                </nav>
            </aside>
            
            <section class="dashboard-content" id="dashboard-view">
                <!-- Orders View -->
                <div class="dashboard-card js-view-orders">
                    <h2 class="dashboard-card__title">Historial de Pedidos</h2>
                    <div id="orders-list">
                        <!-- Inyectado por JS -->
                    </div>
                </div>

                <!-- Addresses View -->
                <div class="dashboard-card js-view-addresses" style="display: none;">
                    <h2 class="dashboard-card__title">Direcciones Guardadas</h2>
                    <p>Funcionalidad simulada para demostración.</p>
                    <div class="c-review-card mt-3">
                        <p><strong>Casa</strong></p>
                        <p>Av. Principal 123, Ciudad, CP 10000</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="global.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
